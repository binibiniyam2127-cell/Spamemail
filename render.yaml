services:
  # FastAPI Backend
  - type: web
    name: spam-api
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      uvicorn deployment.api.app_fastapi:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: API_URL
        value: https://spam-api.onrender.com

  # Streamlit Frontend
  - type: web
    name: spam-streamlit
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      streamlit run deployment/streamlit_app.py --server.port 8501 --server.enableCORS false --server.enableXsrfProtection false
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: API_URL
        value: https://spam-api.onrender.com
